name: Minimal CI

on:
  push:
    branches:
      - 4.x
  pull_request:
    branches:
      - 4.x

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libgtk-3-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIST=core,imgproc,imgcodecs,ts \
            -DBUILD_TESTS=ON \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_V4L=OFF \
            -DWITH_GSTREAMER=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF

      - name: Build
        run: cmake --build build --target opencv_test_core --parallel $(nproc)

      - name: Run core tests
        run: |
          cd build
          ./bin/opencv_test_core --gtest_filter="*:-*OCL*:*CUDA*:*Vulkan*:Core_InputOutput.filestorage_base64_*:Core_globbing.accuracy"
